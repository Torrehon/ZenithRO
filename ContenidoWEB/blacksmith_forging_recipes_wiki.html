    padding: 10px;

  }

  /* Main Container */

    overflow: hidden;

    gap: 15px;
  }

  .header-title-box {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .header-icon {
    width: 44px;
    height: 44px;
    background: rgba(212, 175, 55, 0.15);
    border: 1px solid #d4af37;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .header-icon img {
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
  }

  .header-title-box h2 {
    margin: 0;
    font-family: 'Lato', sans-serif;
    font-size: 1.45em;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #f8fafc;
  }

  .header-title-box p {
    margin: 3px 0 0 0;
    font-size: 0.85em;
    color: #94a3b8;
  }

  .search-box {
    position: relative;
    min-width: 240px;
    flex-grow: 1;
    max-width: 300px;
  }

  .search-input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    border-radius: 20px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #ffffff;
    font-size: 0.88em;
    outline: none;
    transition: all 0.2s ease;
  }
  .search-input:focus {
    border-color: #d4af37;
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.35);
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 14px;
    pointer-events: none;
  }

  /* Filters Bar */
  .filters-bar {
    padding: 16px 24px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .category-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tab-btn {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #475569;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 0.8em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
  }

  .tab-btn:hover {
    background: #f1f5f9;
    color: #1e293b;
    border-color: #94a3b8;
  }

  .tab-btn.active {
    background: #1e293b;
    color: #d4af37;
    border-color: #1e293b;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
  }

  .level-filters {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82em;
    color: #64748b;
    font-weight: 700;
  }

  .lvl-badge-btn {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #475569;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85em;
    transition: all 0.2s ease;
  }
  .lvl-badge-btn:hover { background: #e2e8f0; }
  .lvl-badge-btn.active {
    background: #d4af37;
    color: #ffffff;
    border-color: #d4af37;
  }

  /* Grid Layout */
  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 16px;
    padding: 20px;
    max-height: 650px;
    overflow-y: auto;
    background: #ffffff;
  }

  /* Recipe Card */
  .recipe-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: all 0.2s ease;
  }
  .recipe-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    border-color: #cbd5e1;
  }

  .recipe-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .weapon-sprite-box {
    width: 48px;
    height: 48px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;

    align-items: center;
    justify-content: center;
    flex-shrink: 0;

  .weapon-sprite-box img {
    max-width: 32px;
    max-height: 32px;

  }

  .weapon-title-info {

    min-width: 0;
  }

  .weapon-name {

    font-size: 1.05em;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 4px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .weapon-meta {

    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .badge-item-id {

    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 4px;

  .badge-lvl {

    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;

  .material-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85em;
    color: #334155;
  }

  .material-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
    image-rendering: pixelated;
    flex-shrink: 0;
  }

  .material-name {
    flex: 1;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .material-qty {
    background: #e2e8f0;
    color: #0f172a;
    font-weight: 700;
    font-size: 0.82em;
    padding: 2px 7px;
    border-radius: 10px;
  }

  /* Empty State */
  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    color: #64748b;
    font-size: 0.95em;
  }
</style>

  let currentCategory = 'all';
  let currentLevel = 0;

  function getItemSpriteUrl(itemId) {
    return `https://static.divine-pride.net/images/items/item/raw/${itemId}.png`;
  }

  function renderRecipes() {
    const grid = document.getElementById('recipeGrid');
    const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

    const filtered = weaponsData.filter(item => {
      // Filter by Category
      if (currentCategory !== 'all' && item.type !== currentCategory) return false;
      
      // Filter by Level
      if (currentLevel !== 0 && item.lvl !== currentLevel) return false;

      // Filter by Search Query (Name, ID, or Material Name)
      if (searchVal) {
        const matchesName = item.name.toLowerCase().includes(searchVal);
        const matchesId = item.id.toString().includes(searchVal);
        const matchesMat = item.mats.some(m => m.name.toLowerCase().includes(searchVal) || m.id.toString().includes(searchVal));
        if (!matchesName && !matchesId && !matchesMat) return false;
      }

      return true;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="no-results">🔍 No se encontraron recetas de forja que coincidan con la búsqueda.</div>`;
      return;
    }

    grid.innerHTML = filtered.map(item => {
      const matsHtml = item.mats.map(m => `
        <div class="material-row">
          <img class="material-icon" src="${getItemSpriteUrl(m.id)}" onerror="this.onerror=null; this.src='https://static.divine-pride.net/images/items/item/${m.id}.png';" alt="${m.name}">
          <span class="material-name">${m.name}</span>
          <span class="material-qty">x${m.qty}</span>
        </div>
      `).join('');

      return `
        <div class="recipe-card">
          <div class="recipe-card-header">
            <div class="weapon-sprite-box">
              <img src="${getItemSpriteUrl(item.id)}" onerror="this.onerror=null; this.src='https://static.divine-pride.net/images/items/item/${item.id}.png';" alt="${item.name}">
            </div>
            <div class="weapon-title-info">
              <div class="weapon-name" title="${item.name}">${item.name}</div>
              <div class="weapon-meta">
                <span class="badge-item-id">#${item.id}</span>
                <span class="badge-lvl badge-lvl-${item.lvl}">Lv ${item.lvl}</span>
              </div>
            </div>
          </div>
          
          <div class="materials-container">
            <div class="materials-title">Materiales Requeridos</div>
            ${matsHtml}
          </div>
        </div>
      `;
    }).join('');
  }

  function selectCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderRecipes();
  }
