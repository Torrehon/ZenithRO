- Id: 40004
    AegisName: Dawn_Bow
    Name: Dawn Bow
    Type: Weapon
    SubType: Bow
    Buy: 5000
    Weight: 500
    Attack: 30
    Range: 5
    Slots: 0
    Locations:
      Right_Hand: true
      Left_Hand: true
    WeaponLevel: 2
    EquipLevelMin: 10
    Refineable: true
    Jobs:
      Archer: true
      Hunter: true
      Bard: true
      Dancer: true
      Rogue: true
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoStorage: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    Script: |
      // Bonus base para todos los trabajos
      bonus bAtk, min(JobLevel, 30);

      if (BaseClass == Job_Archer) {
          // +1 ATK por nivel de Vulture's Eye
          if (getskilllv("AC_VULTURE") > 0) {
              bonus bAtk, getskilllv("AC_VULTURE");
          }
          // +0.5% ASPD por nivel de Owl's Eye (1% cada 2 niveles)
          if (getskilllv("AC_OWL") > 0) {
              bonus bAspdRate, (getskilllv("AC_OWL") / 2);
          }
      }